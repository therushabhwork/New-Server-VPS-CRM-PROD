    <circle cx="73" cy="45" r="13"/>
    <circle cx="103" cy="45" r="13"/>
    <circle cx="13" cy="75" r="13"/>
    <circle cx="43" cy="75" r="13"/>
    <circle cx="73" cy="75" r="13"/>
    <circle cx="103" cy="75" r="13"/>
    <circle cx="13" cy="105" r="13"/>
    <circle cx="43" cy="105" r="13"/>
    <circle cx="73" cy="105" r="13"/>
    <circle cx="103" cy="105" r="13"/>
  </g>
  <rect x="154" y="0" width="1.4" height="128" fill="#9aa2a6"/>
  <text x="184" y="61" fill="url(#lumosText)" font-family="Arial, Helvetica, sans-serif" font-size="67" font-weight="400" letter-spacing="4">LUMOS</text>
  <text x="184" y="95" fill="#20aeb4" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.3">Building Automation Pvt. Ltd.</text>
