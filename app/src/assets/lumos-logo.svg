<svg xmlns="http://www.w3.org/2000/svg" width="520" height="128" viewBox="0 0 520 128" role="img" aria-labelledby="lumosTitle lumosDesc">
  <title id="lumosTitle">Lumos Building Automation Pvt. Ltd. logo</title>
  <desc id="lumosDesc">Lumos logo with teal dot grid, divider, and company name on white background.</desc>
  <rect width="520" height="128" fill="#ffffff"/>
  <defs>
    <radialGradient id="lumosDot" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#7cf7f0"/>
      <stop offset="0.55" stop-color="#2abec3"/>
      <stop offset="1" stop-color="#0f686d"/>
    </radialGradient>
    <linearGradient id="lumosText" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#737373"/>
      <stop offset="0.58" stop-color="#3f3f3f"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
  </defs>
  <g transform="translate(9 6)" fill="url(#lumosDot)">
